name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build, lint and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Keep in step with the golang:1.25-alpine image in the Dockerfile.
          go-version: '1.25.x'
      - run: go build ./cmd/crychic
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race ./...

  plugin:
    name: MP plugin host E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Plugin version is consistent
        run: |
          python3 - <<'PY'
          import json, re, sys
          manifest = json.load(open("package.v3.json"))["Crychic"]
          source = open("plugins.v3/crychic/__init__.py").read()
          code = re.search(r'plugin_version = "([^"]+)"', source).group(1)
          version = manifest["version"]
          if code != version or f"v{version}" not in manifest["history"]:
              sys.exit(f"package.v3.json {version}, __init__.py {code}; history needs v{version}")
          PY
      - run: e2e/run_mp_plugin_e2e.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build image
        run: |
          docker build --build-arg VERSION="$(git describe --tags --always --dirty)" -t crychic:ci .
          docker run --rm crychic:ci -version
